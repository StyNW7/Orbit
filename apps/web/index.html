<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAF9" />
    <meta name="description" content="Orbit understands where you are, connects what can help you grow, and shows you what to do next." />
    <title>Orbit — Build Your Path. Become Career-Ready.</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('orbit.theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101714');
        }
      } catch (e) {}
    </script>
    <style>
      /* Boot splash — replaced as soon as React mounts. */
      html { background: #f8faf9; }
      html.dark { background: #101714; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot svg { width: 56px; height: 56px; filter: drop-shadow(0 12px 28px rgba(10, 180, 106, 0.35)); }
      .boot .ring { transform-origin: 32px 32px; animation: boot-spin 2.4s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Orbit">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#0AB46A" />
          <g class="ring">
            <ellipse cx="32" cy="32" rx="22" ry="9" transform="rotate(-28 32 32)" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" />
            <circle cx="50" cy="21" r="5" fill="#FB9002" />
          </g>
          <circle cx="32" cy="32" r="9" fill="#fff" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
